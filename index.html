<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6d5efc" />
  <title>정하기 놀이터</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
</head>
<body>
  <header class="app-header" id="app-header">
    <button class="icon-btn" id="back-btn" aria-label="뒤로" hidden>‹</button>
    <h1 class="app-title" id="app-title">🎯 정하기 놀이터</h1>
    <span class="header-spacer"></span>
  </header>

  <main id="app" class="app-main" aria-live="polite"></main>

  <!-- 토스트 알림 -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- PDF/인쇄 전용 영역 -->
  <div id="print-area" class="print-area" aria-hidden="true"></div>

  <script src="js/storage.js"></script>
  <script src="js/worldcup.js"></script>
  <script src="js/sortable.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
