<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1E7A4E" />
    <meta name="apple-mobile-web-app-title" content="memedics" />
    <meta name="naver-site-verification" content="6a6e2d3afc029e0e1b353d929db7448e76be0f51" />
    <script>
      // 다크모드 FOUC 방지 — 페인트 전에 저장된 선호를 <html>에 반영(없으면 시스템 설정 따름)
      try {
        var t = localStorage.getItem('mmd-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      한글 웹폰트 CSS는 유니코드 서브셋이 웨이트마다 100여 개로 쪼개져 대단히 크다(실측 181KB).
      stylesheet로 걸면 렌더 블로킹이라 HTML이 154ms에 다 와도 첫 픽셀이 1020ms까지 밀렸다.
      preload→onload로 비블로킹 전환한다. display=swap이라 어차피 폴백 먼저 그리는 설계다.
      웨이트는 app.css 실사용분만: serif 400/600/700, sans 400/500/600/700.
      (기존엔 쓰지도 않는 sans 300을 받고, 정작 쓰는 sans 600은 빠져 합성으로 그려졌다.)
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      />
    </noscript>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
