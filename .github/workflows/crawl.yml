name: 밈 크롤

# 수동 실행(workflow_dispatch)으로 먼저 검증. 안정되면 아래 schedule 주석을 풀어 크론으로.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        default: all
        type: choice
        options: [all, comments, naver, backfill]
  schedule:
    # 매일 1회 전체 크롤(댓글+네이버). 14:00 UTC = 23:00 KST(한국 하루 끝) —
    # 블로그 "오늘 글 수"를 그날 거의 다 반영하고, UTC 날짜=한국 날짜가 맞는 시각.
    - cron: '0 14 * * *'
    # 댓글을 더 자주 원하면 아래를 풀되, 유튜브 일일 쿼터(10k units) 주의.
    # - cron: '0 2,8,20 * * *'   # 이땐 mode를 comments로 분기 필요

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
      - name: crawl
        run: node scripts/crawl-once.js ${{ github.event.inputs.mode || 'all' }}
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          youtube_data_api_key: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
